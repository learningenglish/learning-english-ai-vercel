<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Learning English AI — Student</title>
  <meta name="description" content="Học tiếng Anh với bài học do AI tạo riêng cho bạn." />
  <meta name="theme-color" content="#0b0d12" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./css/style.css" />
  <script>
    // Chặn nháy theme + hình nền: đọc + áp dụng NGAY trước khi CSS vẽ, không đợi
    // <script type="module"> (luôn bị hoãn) — xem ghi chú đầy đủ trong app/js/theme.js và
    // app/js/background.js, PHẢI cùng STORAGE_KEY với 2 file đó.
    (function () {
      try {
        var pref = localStorage.getItem("lea_student_theme") || "system";
        var resolved =
          pref === "dark" || pref === "light"
            ? pref
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.setAttribute("data-theme", resolved);
      } catch (e) {}
      try {
        var bgFiles = {
          scene: "bg-scene.svg",
          mountains: "bg-scene-mountains.svg",
          sunset: "bg-scene-sunset.svg",
          ocean: "bg-scene-ocean.svg",
          night: "bg-scene-night.svg",
          sakura: "bg-scene-sakura.svg",
          cat: "bg-scene-cat.svg",
          panda: "bg-scene-panda.svg",
          none: null,
        };
        var bgPref = localStorage.getItem("lea_student_bg") || "scene";
        var bgValue = null;
        if (bgPref.indexOf("custom:") === 0) {
          // Ảnh người dùng tự thêm — data-URL trong localStorage (xem app/js/background.js).
          var customList = JSON.parse(localStorage.getItem("lea_student_bg_custom") || "[]");
          var wanted = bgPref.slice(7);
          for (var i = 0; i < customList.length; i++) {
            if (customList[i] && customList[i].id === wanted) {
              bgValue = 'url("' + customList[i].dataUrl + '")';
              break;
            }
          }
          if (!bgValue) bgValue = 'url("../icons/bg-scene.svg")';
        } else {
          var file = bgFiles.hasOwnProperty(bgPref) ? bgFiles[bgPref] : bgFiles.scene;
          // "../icons/..." (tính từ app/css/style.css, KHÔNG phải từ index.html) — xem ghi
          // chú đầy đủ trong app/js/background.js applyBackground().
          bgValue = file ? 'url("../icons/' + file + '")' : "none";
        }
        document.documentElement.style.setProperty("--bg-scene-image", bgValue);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app-shell">
    <main id="view"><div class="screen screen-center"><div class="spinner"></div></div></main>
    <nav id="bottom-nav" hidden></nav>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
