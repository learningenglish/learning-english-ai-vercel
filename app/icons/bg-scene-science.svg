<svg viewBox="0 0 800 1600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d2a4a" />
      <stop offset="55%" stop-color="#283963" />
      <stop offset="100%" stop-color="#37477a" />
    </linearGradient>
    <radialGradient id="planet-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#7fd4ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7fd4ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="1600" fill="url(#sky)" />

  <!-- sao -->
  <g fill="#ffffff">
    <circle cx="110" cy="120" r="2.5" opacity="0.9" />
    <circle cx="230" cy="80" r="2" opacity="0.6" />
    <circle cx="340" cy="170" r="2" opacity="0.7" />
    <circle cx="560" cy="90" r="2.5" opacity="0.8" />
    <circle cx="680" cy="170" r="2" opacity="0.6" />
    <circle cx="740" cy="60" r="2.5" opacity="0.9" />
    <circle cx="60" cy="330" r="2" opacity="0.6" />
    <circle cx="720" cy="360" r="2" opacity="0.7" />
    <circle cx="160" cy="1200" r="2" opacity="0.5" />
    <circle cx="640" cy="1260" r="2" opacity="0.5" />
  </g>

  <!-- hành tinh có vành đai -->
  <g>
    <circle cx="620" cy="270" r="120" fill="url(#planet-glow)" />
    <circle cx="620" cy="270" r="62" fill="#f2b45f" />
    <circle cx="600" cy="252" r="14" fill="#f7ca8a" opacity="0.9" />
    <circle cx="642" cy="292" r="9" fill="#e09c43" opacity="0.9" />
    <ellipse cx="620" cy="276" rx="104" ry="26" fill="none" stroke="#a8c6f0" stroke-width="9" opacity="0.85" transform="rotate(-16 620 276)" />
  </g>

  <!-- nguyên tử: hạt nhân + 3 quỹ đạo electron -->
  <g transform="translate(200,540)">
    <ellipse rx="120" ry="46" fill="none" stroke="#7fd4ff" stroke-width="6" opacity="0.9" />
    <ellipse rx="120" ry="46" fill="none" stroke="#7fd4ff" stroke-width="6" opacity="0.9" transform="rotate(60)" />
    <ellipse rx="120" ry="46" fill="none" stroke="#7fd4ff" stroke-width="6" opacity="0.9" transform="rotate(120)" />
    <circle r="22" fill="#ffd166" />
    <circle cx="104" cy="-22" r="10" fill="#9ef0c8" />
    <circle cx="-88" cy="58" r="10" fill="#9ef0c8" />
    <circle cx="-30" cy="-108" r="10" fill="#9ef0c8" />
  </g>

  <!-- kính thiên văn nhỏ góc phải -->
  <g transform="translate(600,700) rotate(-30)">
    <rect x="-16" y="-90" width="32" height="140" rx="14" fill="#c5d4ee" />
    <rect x="-11" y="-108" width="22" height="24" rx="9" fill="#9fb4d6" />
  </g>
  <g stroke="#8fa4c8" stroke-width="10" stroke-linecap="round">
    <path d="M600,762 L568,850" />
    <path d="M600,762 L636,850" />
  </g>

  <!-- bình thí nghiệm lớn -->
  <g transform="translate(320,1080)">
    <path d="M-34,-160 L34,-160 L34,-64 L104,96 A24,24 0 0 1 82,130 L-82,130 A24,24 0 0 1 -104,96 L-34,-64 Z" fill="#dbe8fa" opacity="0.92" />
    <path d="M-52,28 L52,28 L82,96 A18,18 0 0 1 66,116 L-66,116 A18,18 0 0 1 -82,96 Z" fill="#63d8a8" />
    <circle cx="-16" cy="66" r="9" fill="#aef0d2" />
    <circle cx="24" cy="86" r="7" fill="#aef0d2" />
    <circle cx="6" cy="44" r="6" fill="#aef0d2" />
    <rect x="-40" y="-176" width="80" height="18" rx="9" fill="#9fb4d6" />
    <!-- bong bóng bay lên -->
    <circle cx="0" cy="-210" r="9" fill="#63d8a8" opacity="0.75" />
    <circle cx="22" cy="-250" r="6" fill="#63d8a8" opacity="0.6" />
    <circle cx="-18" cy="-284" r="5" fill="#63d8a8" opacity="0.5" />
  </g>

  <!-- ống nghiệm nhỏ bên phải -->
  <g transform="translate(520,1130) rotate(10)">
    <path d="M-14,-90 L14,-90 L14,64 A14,14 0 0 1 -14,64 Z" fill="#dbe8fa" opacity="0.92" />
    <path d="M-14,6 L14,6 L14,64 A14,14 0 0 1 -14,64 Z" fill="#f28fb2" />
    <rect x="-18" y="-98" width="36" height="12" rx="6" fill="#9fb4d6" />
  </g>

  <!-- phân tử liên kết cuối trang -->
  <g stroke="#7fd4ff" stroke-width="6" opacity="0.9">
    <path d="M150,1420 L230,1470" />
    <path d="M230,1470 L320,1432" />
    <path d="M550,1450 L630,1490" />
  </g>
  <g fill="#ffd166">
    <circle cx="150" cy="1420" r="16" />
    <circle cx="320" cy="1432" r="13" />
    <circle cx="630" cy="1490" r="14" />
  </g>
  <g fill="#9ef0c8">
    <circle cx="230" cy="1470" r="12" />
    <circle cx="550" cy="1450" r="11" />
  </g>
</svg>
