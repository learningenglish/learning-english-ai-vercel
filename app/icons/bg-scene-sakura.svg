    <circle cx="215" cy="122" r="20" />
    <circle cx="262" cy="130" r="14" />
    <circle cx="600" cy="86" r="20" />
    <circle cx="660" cy="76" r="16" />
    <circle cx="716" cy="66" r="20" />
  </g>
  <g fill="#fcc4d6">
