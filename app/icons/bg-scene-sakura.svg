    <ellipse cx="520" cy="1240" rx="8" ry="4.5" transform="rotate(-22 520 1240)" />
    <ellipse cx="180" cy="1380" rx="9" ry="5" transform="rotate(-12 180 1380)" />
    <ellipse cx="640" cy="1440" rx="9" ry="5" transform="rotate(24 640 1440)" />
