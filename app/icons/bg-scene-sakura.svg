<svg viewBox="0 0 800 1600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdd7e4" />
      <stop offset="45%" stop-color="#fee9f0" />
      <stop offset="100%" stop-color="#fff7f0" />
    </linearGradient>
    <linearGradient id="fuji" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d9bc0" />
      <stop offset="100%" stop-color="#aab6d4" />
    </linearGradient>
  </defs>

  <rect width="800" height="1600" fill="url(#sky)" />
  <circle cx="400" cy="300" r="90" fill="#ffb3c8" opacity="0.75" />

  <!-- núi Phú Sĩ -->
  <path d="M120,760 L400,340 L680,760 Z" fill="url(#fuji)" />
  <path d="M400,340 L472,448 C450,470 430,452 400,470 C370,452 350,470 328,448 Z" fill="#ffffff" />

  <!-- cổng torii kiểu anime -->
  <g fill="#d9455f">
    <rect x="330" y="880" width="22" height="190" rx="6" />
    <rect x="448" y="880" width="22" height="190" rx="6" />
    <rect x="300" y="856" width="200" height="26" rx="12" />
    <rect x="318" y="906" width="164" height="18" rx="9" />
  </g>

  <!-- cành hoa anh đào góc trên -->
  <g fill="#8a5a44">
    <path d="M0,120 Q160,160 260,120 L266,136 Q166,178 0,140 Z" />
    <path d="M800,60 Q660,110 560,90 L556,106 Q662,130 800,84 Z" />
  </g>
  <g fill="#f9a8c1">
