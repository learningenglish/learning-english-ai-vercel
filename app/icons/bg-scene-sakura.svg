  <!-- cánh hoa rơi rải rác -->
  <g fill="#f9a8c1" opacity="0.85">
    <ellipse cx="140" cy="420" rx="9" ry="5" transform="rotate(-25 140 420)" />
    <ellipse cx="660" cy="380" rx="9" ry="5" transform="rotate(20 660 380)" />
    <ellipse cx="240" cy="620" rx="8" ry="4.5" transform="rotate(35 240 620)" />
    <ellipse cx="580" cy="640" rx="8" ry="4.5" transform="rotate(-30 580 640)" />
    <ellipse cx="120" cy="900" rx="9" ry="5" transform="rotate(15 120 900)" />
