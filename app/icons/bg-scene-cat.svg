<svg viewBox="0 0 800 1600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde8c8" />
      <stop offset="50%" stop-color="#fdf3e0" />
      <stop offset="100%" stop-color="#fefaf2" />
    </linearGradient>
  </defs>

  <rect width="800" height="1600" fill="url(#sky)" />
  <circle cx="620" cy="200" r="80" fill="#ffd98a" opacity="0.8" />

  <!-- mèo ngủ cuộn tròn -->
  <g>
    <ellipse cx="400" cy="560" rx="230" ry="150" fill="#f2b878" />
    <ellipse cx="400" cy="580" rx="190" ry="115" fill="#f7cd98" />
    <!-- đuôi cuộn quanh -->
    <path d="M180,600 C150,520 200,420 320,430 L330,470 C240,462 200,530 226,596 Z" fill="#e8a45f" />
    <!-- đầu -->
    <circle cx="520" cy="470" r="95" fill="#f2b878" />
    <!-- tai -->
    <path d="M448,400 L432,320 L500,362 Z" fill="#f2b878" />
    <path d="M592,400 L608,320 L540,362 Z" fill="#f2b878" />
    <path d="M452,388 L444,340 L488,366 Z" fill="#f2909e" />
    <path d="M588,388 L596,340 L552,366 Z" fill="#f2909e" />
    <!-- mắt nhắm + miệng -->
    <path d="M478,470 q14,12 28,0" stroke="#8a5a30" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M534,470 q14,12 28,0" stroke="#8a5a30" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M512,502 q8,10 16,0" stroke="#8a5a30" stroke-width="5" fill="none" stroke-linecap="round" />
