      <circle cx="-16" cy="-8" r="6" /><circle cx="-5" cy="-13" r="6" /><circle cx="6" cy="-13" r="6" /><circle cx="17" cy="-8" r="6" />
    </g>
    <g transform="translate(450,1500) rotate(10)">
