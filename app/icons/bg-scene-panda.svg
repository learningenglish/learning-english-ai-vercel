    <path d="M400,578 q0,14 -16,18 M400,578 q0,14 16,18" stroke="#2f2a2a" stroke-width="5" fill="none" stroke-linecap="round" />
    <!-- măng trúc trong tay -->
    <g transform="rotate(12 400 770)">
      <path d="M388,690 L412,690 L406,830 L394,830 Z" fill="#a4cf8e" />
      <path d="M386,712 L414,712 L410,704 L390,704 Z" fill="#82b56d" />
      <path d="M388,748 L412,748 L409,740 L391,740 Z" fill="#82b56d" />
      <path d="M400,690 L386,662 L400,672 L414,662 Z" fill="#82b56d" />
