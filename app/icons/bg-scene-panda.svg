    <ellipse cx="400" cy="760" rx="180" ry="150" fill="#ffffff" />
    <ellipse cx="400" cy="800" rx="140" ry="105" fill="#f5f2ec" />
    <!-- tay ôm -->
    <path d="M262,720 C240,780 260,846 320,868 L350,820 C312,806 296,764 306,724 Z" fill="#2f2a2a" />
    <path d="M538,720 C560,780 540,846 480,868 L450,820 C488,806 504,764 494,724 Z" fill="#2f2a2a" />
    <!-- chân -->
    <ellipse cx="320" cy="892" rx="52" ry="38" fill="#2f2a2a" />
    <ellipse cx="480" cy="892" rx="52" ry="38" fill="#2f2a2a" />
    <!-- đầu -->
    <circle cx="400" cy="520" r="130" fill="#ffffff" />
    <!-- tai -->
    <circle cx="306" cy="424" r="42" fill="#2f2a2a" />
    <circle cx="494" cy="424" r="42" fill="#2f2a2a" />
    <!-- vệt mắt -->
    <ellipse cx="352" cy="516" rx="34" ry="42" transform="rotate(-14 352 516)" fill="#2f2a2a" />
    <ellipse cx="448" cy="516" rx="34" ry="42" transform="rotate(14 448 516)" fill="#2f2a2a" />
    <circle cx="356" cy="510" r="11" fill="#ffffff" />
    <circle cx="444" cy="510" r="11" fill="#ffffff" />
    <circle cx="358" cy="512" r="5" fill="#2f2a2a" />
    <circle cx="442" cy="512" r="5" fill="#2f2a2a" />
    <!-- mũi + miệng -->
