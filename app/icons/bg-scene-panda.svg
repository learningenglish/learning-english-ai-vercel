<svg viewBox="0 0 800 1600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d7ecd9" />
      <stop offset="50%" stop-color="#e9f5ea" />
      <stop offset="100%" stop-color="#f7fbf5" />
    </linearGradient>
  </defs>

  <rect width="800" height="1600" fill="url(#sky)" />

  <!-- rừng trúc hai bên -->
  <g stroke="#79b06e" stroke-width="26" stroke-linecap="round">
    <path d="M80,0 L80,1600" />
    <path d="M190,0 L190,1600" opacity="0.55" />
    <path d="M720,0 L720,1600" />
    <path d="M615,0 L615,1600" opacity="0.55" />
  </g>
  <!-- đốt trúc -->
  <g stroke="#5c9553" stroke-width="6">
    <path d="M64,240 L96,240" /><path d="M64,520 L96,520" /><path d="M64,830 L96,830" /><path d="M64,1150 L96,1150" /><path d="M64,1430 L96,1430" />
    <path d="M704,300 L736,300" /><path d="M704,600 L736,600" /><path d="M704,920 L736,920" /><path d="M704,1240 L736,1240" /><path d="M704,1500 L736,1500" />
  </g>
  <!-- lá trúc -->
