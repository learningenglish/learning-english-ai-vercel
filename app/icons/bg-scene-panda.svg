  <!-- bụi cỏ + lá rơi cuối trang -->
  <path d="M0,1100 Q200,1050 400,1100 T800,1090 L800,1600 L0,1600 Z" fill="#cfe7c3" />
  <g fill="#9cc389" opacity="0.9">
    <ellipse cx="180" cy="1300" rx="34" ry="9" transform="rotate(-18 180 1300)" />
    <ellipse cx="420" cy="1400" rx="32" ry="9" transform="rotate(14 420 1400)" />
