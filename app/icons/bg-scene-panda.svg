    <ellipse cx="126" cy="620" rx="44" ry="12" transform="rotate(24 126 620)" />
    <ellipse cx="150" cy="1000" rx="42" ry="11" transform="rotate(-22 150 1000)" />
    <ellipse cx="662" cy="380" rx="46" ry="12" transform="rotate(26 662 380)" />
    <ellipse cx="676" cy="720" rx="44" ry="12" transform="rotate(-24 676 720)" />
    <ellipse cx="655" cy="1080" rx="42" ry="11" transform="rotate(20 655 1080)" />
  </g>

  <!-- gấu trúc ôm măng -->
